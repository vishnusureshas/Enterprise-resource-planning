services:
  - type: web
    name: erp-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: API_PREFIX
        value: /api
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        value: "" # MUST set manually: 64 hex chars (32 bytes). Generate via: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "" # Comma-separated frontend URLs (e.g. https://erp-frontend.onrender.com,https://your-custom-domain.com)

databases:
  - name: erp-db
    databaseName: erp
    user: erp_user
    plan: free
