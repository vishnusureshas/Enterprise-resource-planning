services:
  - type: web
    name: erp-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: API_PREFIX
        value: /api
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        # IMPORTANT: Set a persistent 64-char hex key in Render Dashboard for data encryption across restarts.
        # Auto-generated at startup if missing/empty. DO NOT leave empty in production.
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "" # Comma-separated frontend URLs (e.g. https://erp-frontend.onrender.com,https://your-custom-domain.com)
      - key: REDIS_URL
        # RECOMMENDED: Set for production. Without Redis, the app uses in-memory fallbacks (sessions,
        # rate limiting, refresh tokens) which reset on restart. Use Redis Cloud free tier or Upstash.
        value: ""

  - type: web
    name: erp-frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://erp-backend-4r3w.onrender.com/api

databases:
  - name: erp-db
    databaseName: erp
    user: erp_user
    plan: free
